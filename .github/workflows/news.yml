name: 🛡️ S3cur1ty News Fr

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  news:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Récupérer le projet
        uses: actions/checkout@v4

      - name: 🐍 Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 🛡️ Lancer CyberWatch
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python cyberwatch.py

      - name: 💾 Sauvegarder les annonces
        run: |
          git config user.name "CyberWatch Bot"
          git config user.email "cyberwatch@example.com"
          git add seen.json
          git diff --staged --quiet || git commit -m "Update seen articles"
          git push
